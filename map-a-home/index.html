<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Map-A-Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Top bar: who we're helping, profile progress, hearts -->
    <header class="topbar">
      <button class="tb-avatar" data-action="go" data-tab="home" aria-label="Open profile">
        <span id="tb-emoji">👵</span>
      </button>
      <div class="tb-mid">
        <div class="tb-name" id="tb-name">Your loved one</div>
        <div class="xpbar" title="How complete the profile is">
          <div class="xpbar-fill" id="tb-xp"></div>
          <span class="xpbar-label" id="tb-xp-label">Profile 0%</span>
        </div>
      </div>
      <div class="tb-chip" title="Hearted homes"><span>❤️</span><b id="tb-hearts">0</b></div>
      <div class="tb-chip" title="Tours scheduled"><span>📅</span><b id="tb-tours">0</b></div>
    </header>

    <!-- The three tabs sit side by side and slide left/right -->
    <main class="viewport">
      <div class="track" id="track">
        <section class="panel" id="panel-ai" aria-label="AI Care Guide"></section>
        <section class="panel" id="panel-home" aria-label="Home"></section>
        <section class="panel panel-map" id="panel-map" aria-label="Map">
          <div id="map"></div>
          <div class="map-top">
            <div class="chips" id="map-filters"></div>
          </div>
          <div class="legend" id="legend"></div>
          <button class="btn btn-gold map-best" data-action="best-match">⭐ Best match</button>
          <div class="sheet" id="sheet" hidden></div>
        </section>
      </div>
    </main>

    <!-- Bottom tab bar (Clash-style: active tab pops up) -->
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-action="go" data-tab="ai"><span class="tab-ico">🤖</span><span class="tab-lbl">Care Guide</span></button>
      <button class="tab" data-action="go" data-tab="home"><span class="tab-ico">🏡</span><span class="tab-lbl">Home</span></button>
      <button class="tab" data-action="go" data-tab="map"><span class="tab-ico">🗺️</span><span class="tab-lbl">Map</span></button>
    </nav>

    <div class="modal-wrap" id="modal" hidden></div>
    <div class="toasts" id="toasts"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/match.js"></script>
  <script src="js/home.js"></script>
  <script src="js/map.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
