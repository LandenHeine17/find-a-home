# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New + → Blueprint → pick this repo. Render reads this file and creates the service.
services:
  - type: web
    name: find-a-home
    runtime: node
    plan: free
    buildCommand: npm ci && npm run validate
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
